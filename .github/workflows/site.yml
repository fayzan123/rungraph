name: Site

# Live-quiet deploys: after the one-time owner sign-off of the baked demo run,
# every push that touches the page (or the frontend it embeds) rebuilds and
# redeploys the unannounced URL. "Deployed" ≠ "launched".
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'frontend/**'
      # the embed bundles src/find.js + src/deeplink.js, and the bake imports
      # src/bundle.js + src/signals.js — a src-only change must redeploy too
      - 'src/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/build-site.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
